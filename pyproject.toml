[project]
name = "Exploring_Receita_Federal"
version = "0.1.0"
description = "Pipeline CDC para Dados Abertos de CNPJ"
authors = [
    {name = "Seu Nome",email = "seuemail@exemplo.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas (>=3.0.6,<4.0.0)",
    "pyarrow (>=25.0.1,<26.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "boto3 (>=1.43.98,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.16.8,<0.17.0)"
]


[tool.pytest.ini_options]
pythonpath = [
  "src"
]

[tool.poetry]
name = "Exploring_Receita_Federal"
version = "0.1.0"
description = ""
authors = ["Seu Nome <email@exemplo.com>"]
packages = [
    { include = "cnpj_pipeline", from = "src" }
]