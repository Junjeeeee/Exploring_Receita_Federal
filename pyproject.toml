[project]
name = "Exploring_Receita_Federal"
version = "0.1.0"
description = "Pipeline CDC para Dados Abertos de CNPJ"
authors = [
    { name = "João David Jotta Mendonça Estorque", email = "seuemail@exemplo.com" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.0.6,<4.0.0",
    "pyarrow>=25.0.1,<26.0.0",
    "requests>=2.34.2,<3.0.0",
    "python-dotenv>=1.2.3,<2.0.0",
    "boto3>=1.43.98,<2.0.0",
    "tqdm>=4.70.1,<5.0.0",
    "tenacity>=9.1.4,<10.0.0"
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10.0.0",
    "ruff>=0.16.8,<0.17.0"
]
notebooks = [
    "matplotlib>=3.11.2,<4.0.0",
    "seaborn>=0.13.2,<0.14.0",
    "jupyter>=1.1.1,<2.0.0",
    "duckdb>=1.5.5,<2.0.0"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = [
    "src"
]

[tool.poetry]
# No Poetry 2.0+, as informações principais ficam no [project].
# O [tool.poetry] é usado apenas para configurações específicas da ferramenta.
packages = [
    { include = "cnpj_pipeline", from = "src" }
]