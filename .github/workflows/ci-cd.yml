name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ] # Gatilho 1: push direto na main
  pull_request:
    branches: [ "main" ] # Gatilho 2: PRs para a main (evita rodar duas vezes no mesmo PR)

jobs:
  # ---------------------------------------------------
  # CI: Integração Contínua (Testes) - Roda Sempre
  # ---------------------------------------------------
  testes-unitarios:
    name: Validar Testes com Pytest
    runs-on: ubuntu-latest
    
    steps:
      - name: Fazer Checkout do Código
        uses: actions/checkout@v4
      
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Instalar e Configurar o Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true
          
      - name: Carregar Cache de Dependências
        uses: actions/cache@v4
        id: cached-poetry-dependencies
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}
          
      - name: Instalar Dependências
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root
        
      - name: Executar Pytest
        run: poetry run pytest tests/

      - name: Checar se o job YAML está sincronizado com o gerador
        run: poetry run python -m src.jobs.gerar_job --checar
