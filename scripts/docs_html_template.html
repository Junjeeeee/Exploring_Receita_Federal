<title>Guia do tcc_receita</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: trilho de navegação à esquerda, texto em ~70ch no centro, sumário da página à direita em telas largas.
   As cores de camada (landing → bronze → silver → gold) são a única cor forte; o resto é tinta sobre papel frio. */
:root {
  --bg: #f2f4f1; --surface: #ffffff; --ink: #18211d; --muted: #59655f; --line: #d8ded9; --soft: #e7ece8;
  --accent: #0b6e4f; --accent-soft: #dcefe6; --mark: #f6e3a1;
  --l-fonte: #4f5d6b; --l-landing: #3f6f8f; --l-bronze: #9a5b2a; --l-silver: #66737d; --l-gold: #a07b12;
  --bad: #b3261e; --warn: #b26a00;
  --f-display: "Schibsted Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1412; --surface: #161d1a; --ink: #e4ebe6; --muted: #9aa69f; --line: #2a3530; --soft: #1d2622;
  --accent: #4fc79a; --accent-soft: #173328; --mark: #5a4a12;
  --l-fonte: #9aa8b6; --l-landing: #7fb2d4; --l-bronze: #d9925a; --l-silver: #a9b6c0; --l-gold: #dcb648;
  --bad: #f2827a; --warn: #f0b05a; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1412; --surface: #161d1a; --ink: #e4ebe6; --muted: #9aa69f; --line: #2a3530; --soft: #1d2622;
  --accent: #4fc79a; --accent-soft: #173328; --mark: #5a4a12;
  --l-fonte: #9aa8b6; --l-landing: #7fb2d4; --l-bronze: #d9925a; --l-silver: #a9b6c0; --l-gold: #dcb648;
  --bad: #f2827a; --warn: #f0b05a; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.6; margin: 0; }
a { color: var(--accent); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 270px minmax(0, 1fr); min-height: 100vh; }
.nav { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; border-right: 1px solid var(--line);
  background: var(--surface); padding-block: 22px; padding-inline: 18px; font-family: var(--f-display); font-size: 14.5px;
  padding-left: max(18px, env(safe-area-inset-left, 0px)); }
.marca { display: flex; flex-direction: column; gap: 2px; text-decoration: none; color: var(--ink); margin-bottom: 18px; }
.marca b { font-weight: 800; font-size: 19px; letter-spacing: -0.01em; }
.marca span { color: var(--muted); font-size: 12.5px; font-family: var(--f-mono); }
.busca { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
.nav h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); margin: 20px 0 6px; font-weight: 700; }
.nav ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
.nav a.item { display: flex; justify-content: space-between; gap: 8px; padding: 5px 8px; border-radius: 5px; color: var(--ink); text-decoration: none; line-height: 1.3; }
.nav a.item:hover { background: var(--soft); }
.nav a.item[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav .hits { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }
.nav .vazio { color: var(--muted); font-size: 13px; padding: 6px 8px; }
.rodape-nav { margin-top: 24px; font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); line-height: 1.5; }
.abrir-nav { display: none; }

.main { min-width: 0; padding-block: 40px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.pagina { display: grid; grid-template-columns: minmax(0, 72ch) 200px; gap: 48px; justify-content: center; }
.pagina.larga { grid-template-columns: minmax(0, 1040px); }
.toc { position: sticky; top: calc(24px + env(safe-area-inset-top, 0px)); align-self: start; font-family: var(--f-display); font-size: 13px; }
.toc h4 { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); margin: 0 0 8px; }
.toc button { display: block; text-align: left; background: none; border: 0; padding: 4px 0; color: var(--muted); font: inherit; cursor: pointer; line-height: 1.35; }
.toc button:hover { color: var(--accent); }

/* Texto renderizado dos .md */
.doc { min-width: 0; }
.caminho { font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
.doc h1, .doc h2, .doc h3, .doc h4 { font-family: var(--f-display); line-height: 1.2; text-wrap: balance; letter-spacing: -0.01em; scroll-margin-top: 20px; }
.doc h1 { font-size: 2.1rem; font-weight: 800; margin: 0 0 18px; }
.doc h2 { font-size: 1.4rem; margin: 40px 0 10px; padding-top: 14px; border-top: 1px solid var(--line); }
.doc h3 { font-size: 1.12rem; margin: 26px 0 6px; }
.doc p, .doc li { max-width: 72ch; }
.doc ul, .doc ol { padding-left: 1.3em; }
.doc li + li { margin-top: 3px; }
.doc blockquote { margin: 16px 0; padding: 8px 16px; border-left: 3px solid var(--accent); background: var(--surface); color: var(--muted); }
.doc blockquote p { margin: 6px 0; }
.doc code { font-family: var(--f-mono); font-size: 0.84em; background: var(--soft); padding: 1px 5px; border-radius: 4px; }
.doc a code { color: var(--accent); }
.doc pre { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; overflow-x: auto; line-height: 1.45; }
.doc pre code { background: none; padding: 0; font-size: 13px; }
.tabela { overflow-x: auto; margin: 16px 0; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.doc table { border-collapse: collapse; width: 100%; font-size: 14.5px; line-height: 1.45; font-variant-numeric: tabular-nums; }
.doc th { font-family: var(--f-display); text-align: left; font-size: 12.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); background: var(--soft); }
.doc th, .doc td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.doc tr:last-child td { border-bottom: 0; }
.doc tr:has(td:first-child del) { opacity: 0.55; }
.doc hr { border: 0; border-top: 1px solid var(--line); margin: 32px 0; }
.doc .path { font-family: var(--f-mono); font-size: 0.84em; color: var(--muted); }
mark { background: var(--mark); color: inherit; border-radius: 2px; }

/* Visão geral */
.hero { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 40px; align-items: end; margin-bottom: 44px; }
.hero h1 { font-family: var(--f-display); font-size: clamp(2rem, 4.4vw, 3.1rem); line-height: 1.05; font-weight: 800; letter-spacing: -0.025em; margin: 0 0 14px; text-wrap: balance; }
.hero p { color: var(--muted); margin: 0; max-width: 56ch; }
.cnpj { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 20px 22px; }
.cnpj .rot { font-family: var(--f-display); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); margin-bottom: 12px; }
.cnpj .num { display: flex; flex-wrap: wrap; gap: 4px 2px; font-family: var(--f-mono); font-size: clamp(1.25rem, 2.6vw, 1.7rem); font-weight: 500; }
.cnpj .parte { display: flex; flex-direction: column; gap: 6px; }
.cnpj .parte small { font-size: 11px; font-family: var(--f-display); color: var(--muted); border-top: 2px solid currentColor; padding-top: 4px; line-height: 1.3; }
.cnpj .basico small { color: var(--accent); }
.cnpj .sep { color: var(--muted); }
.cnpj p { font-size: 14px; margin: 14px 0 0; color: var(--muted); }

.secao { margin-top: 48px; }
.secao > h2 { font-family: var(--f-display); font-size: 1.3rem; margin: 0 0 4px; letter-spacing: -0.01em; }
.secao > p { color: var(--muted); margin: 0 0 18px; max-width: 70ch; }

.fluxo { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.camada { padding: 16px 14px 18px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: var(--ink); position: relative; min-width: 0; }
.camada:last-child { border-right: 0; }
.camada::before { content: ""; position: absolute; inset: 0 0 auto; height: 5px; background: var(--cor); }
a.camada:hover { background: var(--soft); }
.camada .nome { font-family: var(--f-display); font-weight: 700; font-size: 15px; color: var(--cor); margin-top: 4px; }
.camada .faz { font-size: 14px; line-height: 1.4; }
.camada .onde { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); margin-top: auto; overflow-wrap: anywhere; }

.estado { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; text-decoration: none; color: var(--ink); display: flex; flex-direction: column; gap: 2px; }
a.tile:hover { border-color: var(--accent); }
.tile b { font-family: var(--f-display); font-size: 2rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
.tile span { font-family: var(--f-display); font-size: 13px; color: var(--muted); }
.tile.bad b { color: var(--bad); } .tile.warn b { color: var(--warn); }

.grupo-docs { margin-top: 26px; }
.grupo-docs h3 { font-family: var(--f-display); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); margin: 0 0 10px; }
.cartoes { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.cartao { border-top: 2px solid var(--line); padding: 10px 2px 4px; text-decoration: none; color: var(--ink); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.cartao:hover { border-top-color: var(--accent); }
.cartao b { font-family: var(--f-display); font-weight: 700; font-size: 15.5px; line-height: 1.25; }
.cartao span { font-size: 14px; color: var(--muted); line-height: 1.45; }
.cartao code { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }

@media (max-width: 1180px) { .pagina { grid-template-columns: minmax(0, 72ch); } .toc { display: none; } }
@media (max-width: 980px) {
  .fluxo { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .camada:nth-child(3n) { border-right: 0; } .camada:nth-child(-n+3) { border-bottom: 1px solid var(--line); }
  .hero { grid-template-columns: minmax(0, 1fr); gap: 24px; }
}
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .nav { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding-block: 12px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .nav .topo { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .marca { margin-bottom: 0; }
  .abrir-nav { display: inline-block; font: 600 14px var(--f-display); padding: 7px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); cursor: pointer; }
  .nav:not(.aberta) .corpo-nav { display: none; }
  .corpo-nav { margin-top: 12px; }
  .main { padding-block: 24px 60px; }
  .estado { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 520px) {
  .fluxo { grid-template-columns: minmax(0, 1fr); }
  .camada { border-right: 0; border-bottom: 1px solid var(--line); }
  .camada:last-child { border-bottom: 0; }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

<div class="app">
  <nav class="nav" id="nav" aria-label="Documentos">
    <div class="topo">
      <a class="marca" href="#inicio"><b>tcc_receita</b><span>dados abertos de CNPJ</span></a>
      <button class="abrir-nav" id="abrir-nav" type="button" aria-expanded="false" aria-controls="corpo-nav">Documentos</button>
    </div>
    <div class="corpo-nav" id="corpo-nav">
      <input class="busca" id="busca" type="search" placeholder="Buscar nos documentos" aria-label="Buscar nos documentos" autocomplete="off">
      <div id="lista"></div>
      <div class="rodape-nav" id="rodape"></div>
    </div>
  </nav>
  <main class="main" id="main"></main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
const DADOS = /*__DADOS__*/null;
const porCaminho = new Map(DADOS.docs.map(d => [d.caminho, d]));
const porSlug = new Map(DADOS.docs.map(d => [d.slug, d]));
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const normal = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

// Resolve um link relativo do .md (ex.: ../backlog.md) para o slug do documento, se existir.
function resolver(href, atual) {
  const [alvo] = href.split("#");
  if (!alvo) return null;
  const partes = atual.split("/").slice(0, -1);
  for (const p of alvo.split("/")) {
    if (p === "..") partes.pop(); else if (p && p !== ".") partes.push(p);
  }
  return porCaminho.get(partes.join("/")) || porCaminho.get(alvo) || null;
}

let docAtual = "";
let contador = 0;
const titulos = [];
marked.use({
  gfm: true,
  renderer: {
    link(href, title, text) {
      if (/^[a-z]+:/i.test(href)) return `<a href="${esc(href)}" target="_blank" rel="noopener">${text}</a>`;
      const d = resolver(href, docAtual);
      return d ? `<a href="#${d.slug}">${text}</a>` : `<span class="path" title="${esc(href)}">${text}</span>`;
    },
    codespan(text) {
      const d = porCaminho.get(text.replace(/&amp;/g, "&"));
      return d ? `<a href="#${d.slug}"><code>${text}</code></a>` : `<code>${text}</code>`;
    },
    heading(text, level) {
      const id = `sec-${++contador}`;
      if (level === 2) titulos.push({ id, texto: text.replace(/<[^>]+>/g, "") });
      return `<h${level} id="${id}">${text}</h${level}>`;
    },
  },
});

function destacar(raiz, termo) {
  if (!termo) return;
  const alvo = normal(termo);
  const andador = document.createTreeWalker(raiz, NodeFilter.SHOW_TEXT);
  const nos = [];
  while (andador.nextNode()) nos.push(andador.currentNode);
  for (const no of nos) {
    const i = normal(no.nodeValue).indexOf(alvo);
    if (i < 0 || no.parentElement.closest("pre")) continue;
    const meio = no.splitText(i);
    meio.splitText(termo.length);
    const m = document.createElement("mark");
    meio.replaceWith(m);
    m.appendChild(meio);
  }
}

function renderDoc(d) {
  docAtual = d.caminho; contador = 0; titulos.length = 0;
  const html = marked.parse(d.md);
  const toc = titulos.length > 2
    ? `<aside class="toc"><h4>Nesta página</h4>${titulos.map(t => `<button type="button" data-alvo="${t.id}">${esc(t.texto)}</button>`).join("")}</aside>`
    : `<aside class="toc"></aside>`;
  $("main").innerHTML = `<div class="pagina"><article class="doc"><div class="caminho">${esc(d.caminho)}</div>${html}</article>${toc}</div>`;
  $("main").querySelectorAll(".doc table").forEach(t => {
    const caixa = document.createElement("div"); caixa.className = "tabela";
    t.replaceWith(caixa); caixa.appendChild(t);
  });
  destacar($("main").querySelector(".doc"), $("busca").value.trim());
  const primeira = $("main").querySelector("mark");
  if (primeira) primeira.scrollIntoView({ block: "center" });
}

const CAMADAS = [
  { nome: "Fontes", cor: "--l-fonte", faz: "Receita (ZIP mensal via WebDAV), IBGE (CNAE), Base dos Dados (CEPs), BCB (Selic e IPCA).", onde: "externas" },
  { nome: "Landing", cor: "--l-landing", faz: "Cópia fiel tipada como texto. Mascara CPF antes de sair da máquina.", onde: "src/landing → S3 Parquet", doc: "docs/specs/landing.md" },
  { nome: "Bronze", cor: "--l-bronze", faz: "Um snapshot por mês com pk e change_hash. Sem regra de negócio.", onde: "src/bronze → Delta", doc: "docs/specs/bronze.md" },
  { nome: "Silver intermediate", cor: "--l-silver", faz: "Histórico SCD2 por entidade e log de eventos de negócio: o que mudou e quando.", onde: "src/silver_intermediate", doc: "docs/specs/silver_intermediate.md" },
  { nome: "Silver final", cor: "--l-silver", faz: "Modelo dimensional: dim_empresa, dim_cnae, fato_mudanca_estado.", onde: "src/silver_final", doc: "docs/specs/silver_final.md" },
  { nome: "Gold", cor: "--l-gold", faz: "Fatos mensais, OBT de eventos e datasets do dashboard.", onde: "src/gold", doc: "docs/specs/gold.md" },
];

function renderInicio() {
  const b = DADOS.backlog;
  const backlog = porCaminho.get("docs/backlog.md");
  const linkBacklog = backlog ? `#${backlog.slug}` : "#inicio";
  const camadas = CAMADAS.map(c => {
    const d = c.doc && porCaminho.get(c.doc);
    const tag = d ? "a" : "div";
    return `<${tag} class="camada" style="--cor: var(${c.cor})"${d ? ` href="#${d.slug}"` : ""}>
      <span class="nome">${c.nome}</span><span class="faz">${c.faz}</span><span class="onde">${c.onde}</span></${tag}>`;
  }).join("");
  const grupos = DADOS.grupos.map(g => {
    const ds = DADOS.docs.filter(d => d.grupo === g);
    if (!ds.length) return "";
    return `<div class="grupo-docs"><h3>${g}</h3><div class="cartoes">${ds.map(d =>
      `<a class="cartao" href="#${d.slug}"><b>${esc(d.titulo)}</b>${d.resumo ? `<span>${esc(d.resumo)}</span>` : ""}<code>${esc(d.caminho)}</code></a>`
    ).join("")}</div></div>`;
  }).join("");
  $("main").innerHTML = `<div class="pagina larga"><div>
    <section class="hero">
      <div>
        <h1>Snapshots mensais da Receita viram histórico de empresas</h1>
        <p>Plataforma de dados do TCC sobre os dados abertos de CNPJ. Cada mês a Receita publica uma foto do cadastro;
        o pipeline compara as fotos, guarda as versões de cada empresa (SCD2) e registra eventos de negócio,
        que alimentam o dashboard e, depois, grafo e ML.</p>
      </div>
      <div class="cnpj" aria-label="Anatomia de um CNPJ">
        <div class="rot">Anatomia de um CNPJ (exemplo)</div>
        <div class="num">
          <span class="parte basico">12.345.678<small>cnpj_basico · a empresa</small></span>
          <span class="sep">/</span>
          <span class="parte">0001<small>cnpj_ordem · estabelecimento</small></span>
          <span class="sep">-</span>
          <span class="parte">95<small>dígitos</small></span>
        </div>
        <p>Empresas, sócios e Simples usam só a raiz; estabelecimentos usam o número completo. Por isso as tabelas
        se juntam por <code>cnpj_basico</code>, nunca extraindo o CNPJ de <code>pk</code>.</p>
      </div>
    </section>

    <section class="secao">
      <h2>O caminho dos dados</h2>
      <p>Cada camada tem uma responsabilidade só. Clique numa camada para abrir a spec.</p>
      <div class="fluxo">${camadas}</div>
    </section>

    <section class="secao">
      <h2>Estado do backlog</h2>
      <p>Contado da tabela de bugs em <code>docs/backlog.md</code> quando esta página foi gerada.</p>
      <div class="estado">
        <a class="tile bad" href="${linkBacklog}"><b>${b.criticos}</b><span>críticos abertos 🔴</span></a>
        <a class="tile warn" href="${linkBacklog}"><b>${b.altos}</b><span>altos abertos 🟠</span></a>
        <a class="tile" href="${linkBacklog}"><b>${b.abertos}</b><span>itens abertos no total</span></a>
        <a class="tile" href="${linkBacklog}"><b>${b.resolvidos}</b><span>resolvidos</span></a>
      </div>
    </section>

    <section class="secao">
      <h2>Documentos</h2>
      <p>Tudo abaixo vem dos arquivos Markdown do repositório. Para atualizar, edite o .md e gere a página de novo.</p>
      ${grupos}
    </section>
  </div></div>`;
}

function renderLista() {
  const termo = normal($("busca").value.trim());
  const atual = location.hash.slice(1) || "inicio";
  let total = 0;
  const html = DADOS.grupos.map(g => {
    const itens = DADOS.docs.filter(d => d.grupo === g).map(d => {
      let hits = 0;
      if (termo) hits = normal(d.md).split(termo).length - 1;
      if (termo && !hits) return "";
      total++;
      return `<li><a class="item" href="#${d.slug}"${d.slug === atual ? ' aria-current="page"' : ""}><span>${esc(d.titulo)}</span>${hits ? `<span class="hits">${hits}</span>` : ""}</a></li>`;
    }).join("");
    return itens ? `<h3>${g}</h3><ul>${itens}</ul>` : "";
  }).join("");
  $("lista").innerHTML = (termo ? "" : `<h3>Início</h3><ul><li><a class="item" href="#inicio"${atual === "inicio" ? ' aria-current="page"' : ""}><span>Visão geral</span></a></li></ul>`)
    + (html || `<div class="vazio">Nenhum documento cita “${esc($("busca").value)}”.</div>`);
}

function rota() {
  const d = porSlug.get(location.hash.slice(1));
  if (d) { renderDoc(d); document.title = `${d.titulo} · tcc_receita`; }
  else { renderInicio(); document.title = "Guia do tcc_receita"; }
  renderLista();
  $("nav").classList.remove("aberta"); $("abrir-nav").setAttribute("aria-expanded", "false");
  if (!$("main").querySelector("mark")) window.scrollTo(0, 0);
}

$("rodape").innerHTML = `gerado em ${esc(DADOS.gerado_em)}<br>${esc(DADOS.branch)} @ ${esc(DADOS.commit)}<br>${DADOS.docs.length} documentos`;
$("busca").addEventListener("input", () => {
  renderLista();
  const d = porSlug.get(location.hash.slice(1));
  if (d) renderDoc(d);
});
$("abrir-nav").addEventListener("click", () => {
  const aberta = $("nav").classList.toggle("aberta");
  $("abrir-nav").setAttribute("aria-expanded", String(aberta));
});
$("main").addEventListener("click", e => {
  const b = e.target.closest(".toc button");
  if (b) document.getElementById(b.dataset.alvo)?.scrollIntoView({ block: "start" });
});
window.addEventListener("hashchange", rota);
rota();
</script>
