# GERADO por src/jobs/gerar_job.py — não editar à mão (rode `python -m src.jobs.gerar_job`).
# Formato da UI (Workflows → Job → ⋮ → Edit as YAML) / Asset Bundles (resources.jobs.<chave>).
# Campos a ajustar no workspace: ver src/jobs/README.md.
resources:
  jobs:
    tcc_receita_pipeline:
      name: tcc_receita_pipeline
      max_concurrent_runs: 1
      timeout_seconds: 14400
      parameters:
      - name: mes_referencia_inicial
        default: "2023-05"
      - name: mes_referencia_final
        default: "2023-08"
      git_source:
        git_url: https://github.com/Junjeeeee/Exploring_Receita_Federal
        git_provider: gitHub
        git_branch: ceps_ibge_and_dashboard_v2
      job_clusters:
      - job_cluster_key: cluster_pipeline
        new_cluster:
          spark_version: "15.4.x-scala2.12"
          node_type_id: r5d.xlarge
          driver_node_type_id: m5d.xlarge
          autoscale:
            min_workers: 1
            max_workers: 4
          aws_attributes:
            availability: SPOT_WITH_FALLBACK
            first_on_demand: 1
            spot_bid_price_percent: 100
            zone_id: "auto"
          data_security_mode: SINGLE_USER
          spark_conf:
            spark.sql.shuffle.partitions: "auto"
            spark.databricks.delta.optimizeWrite.enabled: "true"
            spark.scheduler.mode: "FAIR"
          spark_env_vars:
            AWS_BUCKET_NAME: lakehouse-receita
          custom_tags:
            projeto: tcc_receita
      tasks:
      - task_key: bronze_cnaes_ibge
        job_cluster_key: cluster_pipeline
        spark_python_task:
          python_file: src/jobs/run_bronze.py
          source: GIT
          parameters:
          - --modo
          - ingestao
          - --tabelas
          - cnaes_ibge
          - --mes_referencia_inicial
          - "{{job.parameters.mes_referencia_inicial}}"
          - --mes_referencia_final
          - "{{job.parameters.mes_referencia_final}}"
      - task_key: bronze_dq_cnaes_ibge
        job_cluster_key: cluster_pipeline
        spark_python_task:
          python_file: src/jobs/run_bronze.py
          source: GIT
          parameters:
          - --modo
          - dq
          - --tabelas
          - cnaes_ibge
          - --mes_referencia_inicial
          - "{{job.parameters.mes_referencia_inicial}}"
          - --mes_referencia_final
          - "{{job.parameters.mes_referencia_final}}"
        depends_on:
        - task_key: bronze_cnaes_ibge
      - task_key: bronze_paises
        job_cluster_key: cluster_pipeline
        spark_python_task:
          python_file: src/jobs/run_bronze.py
          source: GIT
          parameters:
          - --modo
          - ingestao
          - --tabelas
          - paises
          - --mes_referencia_inicial
          - "{{job.parameters.mes_referencia_inicial}}"
          - --mes_referencia_final
          - "{{job.parameters.mes_referencia_final}}"
      - task_key: bronze_dq_paises
        job_cluster_key: cluster_pipeline
        spark_python_task:
          python_file: src/jobs/run_bronze.py
          source: GIT
          parameters:
          - --modo
          - dq
          - --tabelas
          - paises
          - --mes_referencia_inicial
          - "{{job.parameters.mes_referencia_inicial}}"
          - --mes_referencia_final
